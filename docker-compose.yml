services:
  claude-cron:
    build: .
    container_name: claude-cron
    restart: unless-stopped
    environment:
      # Token lu depuis le fichier .env (non versionné, voir .env.example).
      # NE JAMAIS mettre ANTHROPIC_API_KEY ici : ça basculerait sur la
      # facturation API au lieu d'utiliser ton abonnement Pro/Max.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - TZ=Europe/Paris
    volumes:
      # Optionnel : persiste les logs du cron entre redémarrages du container
      - ./logs:/var/log
